# ==========================================
# SubHero — Fly.io Deployment Configuration
# ==========================================

app = "subhero"
primary_region = "los"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs database migrations securely as a separate release phase before scaling
  release_command = "python manage.py migrate --noinput"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.production"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[http_service.concurrency]
  type = "requests"
  hard_limit = 25
  soft_limit = 20
