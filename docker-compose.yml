version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: subhero_postgres
    environment:
      POSTGRES_DB: subhero_db
      POSTGRES_USER: subhero
      POSTGRES_PASSWORD: subhero
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subhero -d subhero_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: subhero_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
