<!-- Top Bar Partial -->
<header class="top-bar">
    <div class="flex items-center gap-3">
        {% if show_back %}
        <button class="top-bar-icon" onclick="history.back()" aria-label="Go back">
            <i data-feather="arrow-left" class="w-5 h-5"></i>
        </button>
        {% endif %}
        
        <h1 class="top-bar-title">{{ page_title|default:"SubHero" }}</h1>
    </div>

    <div class="flex items-center gap-2">
        {% block top_bar_actions %}
        <button onclick="window.triggerAppReload && window.triggerAppReload()" class="top-bar-icon flex items-center justify-center text-text-secondary hover:text-brand-primary transition-colors mr-1" aria-label="Refresh Page">
            <i data-feather="refresh-cw" class="w-4.5 h-4.5"></i>
        </button>
        <a href="{% url 'notifications:list' %}" class="top-bar-icon relative flex items-center justify-center no-underline text-text-secondary" aria-label="Notifications">
            <i data-feather="bell" class="w-5 h-5"></i>
            {% if unread_notifications_count and unread_notifications_count > 0 %}
            <span class="absolute top-[6px] right-[6px] w-2.5 h-2.5 bg-status-danger rounded-full border-2 border-surface-card"></span>
            {% endif %}
        </a>
        {% endblock %}
    </div>
</header>
