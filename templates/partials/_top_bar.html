<!-- Top Bar Partial -->
<header class="top-bar">
    <div class="flex items-center gap-3">
        {% if show_back %}
        <button class="top-bar-icon" onclick="history.back()" aria-label="Go back">
            <i data-feather="arrow-left" class="w-5 h-5"></i>
        </button>
        {% endif %}
        
        <h1 class="top-bar-title">{{ page_title|default:"SubHero" }}</h1>
    </div>

    <div class="flex items-center gap-2">
        {% block top_bar_actions %}
        <button class="top-bar-icon" aria-label="Notifications">
            <i data-feather="bell" class="w-5 h-5"></i>
            {% if unread_notifications %}
            <span class="absolute top-[6px] right-[6px] w-2 h-2 bg-status-danger rounded-full border-2 border-surface-card"></span>
            {% endif %}
        </button>
        {% endblock %}
    </div>
</header>
