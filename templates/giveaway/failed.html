{% extends 'base.html' %}
{% block title %}Claim Failed — SubHero{% endblock %}

{% block content %}
<div class="px-4 pt-20 pb-10 max-w-sm mx-auto text-center flex flex-col justify-center min-h-[80vh]">
    <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
        <i data-feather="x" class="w-10 h-10"></i>
    </div>
    
    <h1 class="text-2xl font-bold text-text-primary mb-2">Claim Failed</h1>
    <p class="text-sm text-text-muted mb-8">We encountered an issue processing your reward. The slot has been released back to the pool.</p>
    
    <a href="{% url 'giveaway:claim_page' giveaway.slug %}" class="btn btn-primary btn-block py-3.5 rounded-xl font-bold text-sm no-underline inline-block text-white">
        Try Again
    </a>
</div>
{% endblock %}
