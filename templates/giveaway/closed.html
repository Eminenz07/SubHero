{% extends 'base.html' %}
{% block title %}Giveaway Closed — SubHero{% endblock %}

{% block content %}
<div class="px-4 pt-20 pb-10 max-w-sm mx-auto text-center flex flex-col justify-center min-h-[80vh]">
    <div class="w-20 h-20 bg-gray-100 text-gray-500 rounded-full flex items-center justify-center mx-auto mb-6">
        <i data-feather="lock" class="w-10 h-10"></i>
    </div>
    
    <h1 class="text-2xl font-bold text-text-primary mb-2">Giveaway Closed</h1>
    <p class="text-sm text-text-muted mb-8">This giveaway has either expired or all available slots have been fully claimed. Stay tuned for the next one!</p>
    
    <a href="{% url 'landing' %}" class="btn btn-primary btn-block py-3.5 rounded-xl font-bold text-sm no-underline inline-block">
        Return to SubHero
    </a>
</div>
{% endblock %}
